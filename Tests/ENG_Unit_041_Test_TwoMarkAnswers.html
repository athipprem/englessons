 "t2": "<h4>The Spelling Mistake</h4>\n<p>Mai had been working on her poster for two weeks. It showed a green planet with a face made of leaves, and across the top she had painted TAKE CARE OF OUR WORLD in letters as tall as her hand. Every night she had added one more tiny detail: a bee on a flower, a drop of dew, a snail on a leaf.</p>\n<p>She and her best friend, Lin, had both entered the class poster competition. They had sat side by side all week, colouring in silence.</p>\n<p>On Friday morning, Mr Reed stood at the front of the class holding a sheet of gold stars. “The winner,” he said, “is Lin.”</p>\n<p>The whole class clapped. Chairs scraped as people turned to look at Lin. Mai’s hands stayed in her lap. Slowly, she slid her own poster off her desk, folded it in half, and pushed it deep into her bag, behind her lunch box.</p>\n<p>At lunch, Lin came over to the bench where Mai was sitting. She was staring at the floor and twisting her sleeve round one finger. “Could you check my spelling before it goes up in the hall?” she asked. “I’m not very good at it.”</p>\n<p>Mai took the poster. Her eyes moved slowly along the words, and then they stopped. Lin had spelt library with only one R: libary. For a moment, Mai said nothing. She looked at the poster, and then at Lin, who was still staring at the floor. Then she took a pencil from the table and quietly fixed it.</p>\n<p>“Thank you,” Lin whispered.</p>\n<p>When the poster went up in the hall that afternoon, Lin threw her arms round Mai and hugged her so tightly that Mai nearly dropped her bag.</p>\n<p>That evening, Mai took her own poster out of her bag. She smoothed out the fold with the flat of her hand, pressed each corner flat, and pinned it above her bed. Then she stood back and looked at the little bee for a long time.</p>",
 "t3": "<h4>Give Us a Longer Lunch Break!</h4>\n<p><i>By a Year 6 student</i></p>\n<p>Every school day, the lunch bell rings at ten past twelve and, forty minutes later, it rings again. I am in Year 6, and I think forty minutes is far too short. That is not enough time to eat, play and talk. Our lunch break should be one hour long.</p>\n<p>First, we need time to move. Doctors say children our age need at least 60 minutes of exercise every day. Most of us are on the playground for fifteen minutes at best, and then we sit down again for the whole afternoon.</p>\n<p>Second, we have to eat too quickly. By the time we have queued for our food, there is hardly any time left to play, so we gulp down our meals. Many pupils leave food on their plates because they are in a hurry.</p>\n<p>Third, a longer break gives us time to make friends with children from other classes. We only ever play with the people who sit next to us. A real conversation needs more than a few minutes squeezed in between two mouthfuls.</p>\n<p>Some teachers say we would lose lesson time, but we would learn better after a proper rest.</p>\n<p>Lunch break is the best part of the whole school day. I hope our headteacher will try an hour-long break for one month and ask the pupils what they think. If it does not work, the bell can always go back to forty minutes.</p>"
};
/* ---------- END EDIT PER UNIT ---------- */

document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

const chosen = {};      // qn -> mcq index (1-based) or written answer text
let submitted = false;
const openedAtMs = Date.now();
const openedAt = new Date().toISOString();
let frozenSecs = null;
let reviewOpenedMs = null, reviewMsTotal = 0;
let snapshot = null;     // written answers as they were when the review screen first opened

function fmtClock(s){ const m = Math.floor(s/60), r = s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }
function elapsedSecs(){ return frozenSecs !== null ? frozenSecs : Math.round((Date.now()-openedAtMs)/1000); }
function tick(){ document.getElementById('timer').textContent = fmtClock(elapsedSecs()); }
setInterval(tick, 1000); tick();

function render(){
  let html = '';
  SECTION_ORDER.forEach(sec => {
    html += `<div class="band ${sec}">${SECTION_LABEL[sec]}</div>`;
    html += `<div class="hint">${SECTION_HINT[sec]}</div>`;
    html += `<div class="grp"><div class="passage">${PASSAGES[sec]}</div><div class="qs">`;
    Q.filter(q => q.section === sec).forEach(q => {
      html += `<div class="q ${q.section}" id="q-${q.n}">
        <p class="body"><span class="qnum">Q${q.n}.</span> ${q.body}
          ${q.type==='written' ? `<span class="marks-tag">(${q.marks} mks)</span>` : ''}
          <span class="result-tag ok" id="tag-ok-${q.n}">&#10003; correct</span>
          <span class="result-tag bad" id="tag-bad-${q.n}">&#10007; not quite</span>
          <span class="result-tag pending" id="tag-pending-${q.n}">awaiting Naomi</span>
        </p>`;
      if (q.type === 'mcq'){
        html += `<div>`;
        q.options.forEach((opt, idx) => {
          html += `<button class="opt" id="opt-${q.n}-${idx+1}" onclick="choose(${q.n}, ${idx+1})">${'ABCD'[idx]}. ${opt}</button>`;
        });
        html += `</div>`;
      } else {
        html += `<textarea class="writtenin" id="in-${q.n}" placeholder="Write your answer in full sentences..." oninput="typeAnswer(${q.n}, this.value)"></textarea>`;
      }
      if (q.type === 'mcq') html += `<div class="why" id="why-${q.n}">💡 <b>Why:</b> ${q.why||''}</div>`;
      if (q.type === 'written'){
        html += `<div class="markscheme" id="ms-${q.n}"><b>Mark scheme (${q.marks} marks):</b><ul>${(q.markScheme||[]).map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
      }
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('quiz').innerHTML = html;
}

function choose(qn, idx){
  if (submitted) return;
  chosen[qn] = idx;
  const q = Q.find(x => x.n === qn);
  q.options.forEach((_, i) => document.getElementById(`opt-${qn}-${i+1}`).classList.remove('selected'));
  document.getElementById(`opt-${qn}-${idx}`).classList.add('selected');
  updateProgress();
}
function typeAnswer(qn, val){ if (submitted) return; chosen[qn] = val; updateProgress(); }
// Any non-empty answer counts. A correct written answer can be short, and nothing blocks him.
function isAnswered(q){
  const v = chosen[q.n];
  if (q.type === 'written') return v !== undefined && v.trim().length > 0;
  return v !== undefined && v !== '';
}
function updateProgress(){
  const n = Q.filter(isAnswered).length;
  document.getElementById('progress-label').textContent = `${n} / ${Q.length} answered`;
  document.getElementById('progress-fill').style.width = (n/Q.length*100) + '%';
  const btn = document.getElementById('btn-submit');
  btn.disabled = false;
  btn.textContent = (n === Q.length) ? 'Submit the test' : `Submit (${Q.length-n} not answered yet) — tap to jump there`;
}
function firstUnanswered(){ return Q.find(q => !isAnswered(q)); }

// ---- the "Check your answers" screen (plan section 6.4): asks, never blocks ----
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function askConfirmSubmit(){
  const missing = firstUnanswered();
  if (missing){
    const el = document.getElementById(`q-${missing.n}`);
    if (el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('jump-highlight');
      setTimeout(() => el.classList.remove('jump-highlight'), 2000);
    }
    return;
  }
  openReview();
}
function openReview(){
  if (snapshot === null){
    snapshot = {};
    Q.filter(q => q.type === 'written').forEach(q => snapshot[q.n] = chosen[q.n] || '');
  }
  reviewOpenedMs = Date.now();
  let h = '';
  Q.filter(q => q.type === 'written').forEach(q => {
    h += `<div class="rv-item" id="rv-${q.n}">
      <div class="rv-q"><b>Q${q.n}.</b> ${q.body}</div>
      <div class="rv-ans" id="rv-ans-${q.n}">${esc(chosen[q.n]||'')}</div>
      <textarea class="writtenin rv-edit" id="rv-in-${q.n}" style="display:none" oninput="typeAnswer(${q.n}, this.value)">${esc(chosen[q.n]||'')}</textarea>
      <button class="btn chk" id="rv-eb-${q.n}" onclick="editAnswer(${q.n})">Edit this answer</button>
      <label class="rv-tick"><input type="checkbox" id="rv-t1-${q.n}"> I answered the question that was asked.</label>
      <label class="rv-tick"><input type="checkbox" id="rv-t2-${q.n}"> I used words from the text to show how I know.</label>
    </div>`;
  });
  document.getElementById('review-items').innerHTML = h;
  document.getElementById('review').classList.add('show');
  window.scrollTo(0,0);
}
function editAnswer(qn){
  document.getElementById(`rv-ans-${qn}`).style.display = 'none';
  const t = document.getElementById(`rv-in-${qn}`);
  t.style.display = 'block'; t.focus();
  document.getElementById(`rv-eb-${qn}`).style.display = 'none';
  const main = document.getElementById(`in-${qn}`); if (main) main.value = chosen[qn] || '';
}
// ---- longestRun: longest run of consecutive words in the answer that also appear consecutively in the passage ----
function normWords(s){
  return String(s||'').replace(/<[^>]+>/g,' ').toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean);
}
function longestRun(answer, passageHtml){
  const a = normWords(answer), p = normWords(passageHtml);
  let best = 0;
  for (let i = 0; i < a.length; i++){
    for (let j = 0; j < p.length; j++){
      let k = 0;
      while (i+k < a.length && j+k < p.length && a[i+k] === p[j+k]) k++;
      if (k > best) best = k;
    }
  }
  return best;
}

let lastResults = null;

function doSubmit(){
  if (submitted) return;
  let reviewSeconds = Math.round(reviewMsTotal/1000);
  if (reviewOpenedMs !== null) reviewSeconds = Math.round((reviewMsTotal + (Date.now()-reviewOpenedMs))/1000);
  submitted = true;
  const ticks = {};
  Q.filter(q => q.type === 'written').forEach(q => {
    const a = document.getElementById(`rv-t1-${q.n}`), b = document.getElementById(`rv-t2-${q.n}`);
    ticks[q.n] = { answered: !!(a && a.checked), proof: !!(b && b.checked) };
  });
  document.getElementById('review').classList.remove('show');
  frozenSecs = Math.round((Date.now()-openedAtMs)/1000); tick();
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  document.querySelectorAll('textarea.writtenin').forEach(t => { if (t.id.indexOf('in-') === 0) { t.value = chosen[parseInt(t.id.slice(3),10)] || ''; } t.disabled = true; });

  let autoScore = 0;
  const tierTally = {Basic:{c:0,t:0},Intermediate:{c:0,t:0},Applied:{c:0,t:0}};
  const sectionTally = {}; SECTION_ORDER.forEach(s => sectionTally[s]={c:0,t:0});
  const strandTally = {L:{c:0,t:0,w:0}, U:{c:0,t:0,w:0}, E:{c:0,t:0,w:0}};
  const written = [];

  const answers = Q.map(q => {
    const given = chosen[q.n];
    if (q.type === 'written'){
      const resp = given || '';
      written.push({ q:q.n, strand:q.strand, marks:q.marks, markScheme:q.markScheme,
                     response: resp, responseBeforeReview: snapshot[q.n] || '',
                     wordCount: resp.trim().split(/\s+/).filter(Boolean).length,
                     longestRun: longestRun(resp, PASSAGES[q.passageId]),
                     reviewTicks: ticks[q.n],
                     editedOnReview: resp !== (snapshot[q.n] || '') });
      document.getElementById(`ms-${q.n}`).classList.add('show');
      document.getElementById(`tag-pending-${q.n}`).classList.add('show');
      tierTally.Applied.t++;
      strandTally[q.strand].w += q.marks;
      return { q:q.n, section:q.section, type:q.type, strand:q.strand, tier:q.tier, given, isCorrect:null };
    }
    const isCorrect = given === q.ans;
    document.getElementById(`opt-${q.n}-${given}`).classList.add(isCorrect?'correct':'wrong');
    if (!isCorrect) document.getElementById(`opt-${q.n}-${q.ans}`).classList.add('correct');
    if (isCorrect) autoScore++;
    tierTally[q.tier].t++; if (isCorrect) tierTally[q.tier].c++;
    sectionTally[q.section].t++; if (isCorrect) sectionTally[q.section].c++;
    strandTally[q.strand].t++; if (isCorrect) strandTally[q.strand].c++;
    document.getElementById(`why-${q.n}`).classList.add('show');
    document.getElementById(isCorrect?`tag-ok-${q.n}`:`tag-bad-${q.n}`).classList.add('show');
    return { q:q.n, section:q.section, type:q.type, strand:q.strand, tier:q.tier, given, correct:q.ans, isCorrect };
  });

  const banner = document.getElementById('score-banner');
  banner.classList.add('show','pass');
  document.getElementById('score-big').textContent = `Auto score: ${autoScore} / ${AUTO_OUT_OF}`;
  document.getElementById('score-msg').textContent = `The ${WRITTEN_MARKS} written marks are waiting for Naomi. Pass bar for the full test is ${PASS_BAR}/${TOTAL_MARKS}.`;
  document.getElementById('section-scores').innerHTML =
    SECTION_ORDER.map(s => {
      const wrT = Q.filter(q=>q.section===s && q.type==='written').length;
      return `<div class="sec-chip">${SECTION_SHORT[s]}: ${sectionTally[s].c}/${sectionTally[s].t} auto (+${wrT} written)</div>`;
    }).join('') +
    `<div class="sec-chip">Time: ${fmtClock(frozenSecs)}</div>`;

  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('btn-submit').style.display = 'none';
  document.getElementById('btn-save').style.display = 'inline-block';
  document.getElementById('btn-hub').style.display = 'inline-block';
  const st = document.getElementById('save-status');
  st.className = 'reminder'; st.textContent = 'Press the blue Save button — your results are NOT saved yet.';

  const strands = {};
  ['L','U','E'].forEach(k => strands[k] = { score:strandTally[k].c, outOf:strandTally[k].t, writtenMarks:strandTally[k].w });

  lastResults = {
    student: "Prem",
    unit: UNIT_NUM,
    unitTitle: UNIT_TITLE,
    dateTaken: new Date().toISOString().slice(0,10),
    submittedAt: new Date().toISOString(),
    openedAt: openedAt,
    minutesSpent: Math.round(frozenSecs/60),
    secondsSpent: frozenSecs,
    reviewSeconds: reviewSeconds,
    autoScore, autoOutOf: AUTO_OUT_OF,
    writtenMarks: WRITTEN_MARKS, writtenScore: null,
    total: TOTAL_MARKS, passBar: PASS_BAR, passed: null,
    strands,
    tiers: tierTally,
    sections: SECTION_ORDER.map(s => ({ name:s, score:sectionTally[s].c, outOf:sectionTally[s].t })),
    answers,
    written
  };
}

async function saveResults(){
  const filename = `ENG_U041_Results_${lastResults.dateTaken}.json`;
  const json = JSON.stringify(lastResults, null, 2);
  const statusEl = document.getElementById('save-status');
  if (window.showSaveFilePicker){
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description:'Test results JSON', accept:{'application/json':['.json']} }] });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      statusEl.className = ''; statusEl.textContent = `Saved as ${filename}.`;
      return;
    } catch(e){ if (e.name === 'AbortError'){ statusEl.className = 'reminder'; statusEl.textContent = 'Save cancelled — your results are NOT saved yet. Click the blue button again.'; return; } }
  }
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  statusEl.className = ''; statusEl.textContent = `Downloaded ${filename} — please move it into Lessons\\Tests\\Results.`;
}

render();
updateProgress();
</script>
