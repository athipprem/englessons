<script>
/* ---------- EDIT PER UNIT ---------- */
const UNIT_NUM   = 38;
const UNIT_TITLE = "Paper 1: Vocabulary & Reading";
const UNIT_SUB   = "School Unit Test 3-4 Prep 🏫";
const PASS_BAR   = 48;                 // out of 60
const TOTAL_MARKS = 60;
const AUTO_OUT_OF = 42;
const WRITTEN_MARKS = 18;

const SECTION_ORDER = ['spell','meaning','boxcloze','reading'];
const SECTION_LABEL = {
  spell:   "SECTION A — Fix the Spelling",
  meaning: "SECTION B — What Does It Mean?",
  boxcloze:"SECTION C — Fill From the Box",
  reading: "SECTION D — Reading Comprehension"
};
const SECTION_HINT = {
  spell:   "Read the sentence. The underlined word is misspelled — type it correctly.",
  meaning: "Match each word to its letter using the definitions panel above.",
  boxcloze:"Read the whole sentence first. Choose the one box word that fits. Not every box word is used.",
  reading: "Read each text fully before answering. Answer using full, proper sentences."
};

const DEFINITIONS = [
  "looked at someone in a very angry way",
  "dead and finished forever, and never able to become active again",
  "a flat, high area of land",
  "up in the air and flying",
  "a person who moves from place to place to find water and food",
  "full of tiny holes that let water or air pass through",
  "someone or something that comes into a place where it is not wanted",
  "to wear something away slowly, a little at a time",
  "an area with a fence or walls all around it, where animals are kept",
  "sleeping, or not active at the moment, but able to wake up again"
];
const BOX_WORDS = ["admired","balance","climate","competition","crater","crouched","delta","dismay","injured","species","stumbled","survive"];

const Q = [
  /* ===== SECTION A — Spelling correction (Q1-10), type spell, 1 mark each ===== */
  { n:1, section:'spell', type:'spell', tier:'Intermediate', marks:1,
    body:'"The waterfall\'s height made for a <u>spektakuler</u> view from the lookout point."', ans:'spectacular',
    why:'The correct spelling is "spectacular" — spec-TAC-u-lar, four beats, none dropped.' },
  { n:2, section:'spell', type:'spell', tier:'Intermediate', marks:1,
    body:'"Every house on our street knows each other well in this <u>naybourhood</u>."', ans:'neighbourhood',
    why:'The correct spelling is "neighbourhood" — British spelling keeps the "-our".' },
  { n:3, section:'spell', type:'spell', tier:'Intermediate', marks:1,
    body:'"Austin used his <u>binokulars</u> to watch the eagle circle over the mountain."', ans:'binoculars',
    why:'The correct spelling is "binoculars" — with a "c", not a "k".' },
  { n:4, section:'spell', type:'spell', tier:'Intermediate', marks:1,
    body:'"The whole village lost <u>electrisity</u> during the storm last night."', ans:'electricity',
    why:'The correct spelling is "electricity" — with a "c", not an "s".' },
  { n:5, section:'spell', type:'spell', tier:'Intermediate', marks:1,
    body:'"She <u>wispered</u> the answer so the rest of the class wouldn\'t hear."', ans:'whispered',
    why:'The correct spelling is "whispered" — don\'t drop the silent "h".' },
  { n:6, section:'spell', type:'spell', tier:'Intermediate', marks:1,
    body:'"It took real <u>imajinasion</u> to turn the broken chip into something new."', ans:'imagination',
    why:'The correct spelling is "imagination" — with a "g" (sounds like "j") and "-tion".' },
  { n:7, section:'spell', type:'spell', tier:'Intermediate', marks:1,
    body:'"The sky <u>gradualy</u> turned orange as the sun set over the desert."', ans:'gradually',
    why:'The correct spelling is "gradually" — with a double "l" at the end.' },
  { n:8, section:'spell', type:'spell', tier:'Intermediate', marks:1,
    body:'"The vet <u>egzamined</u> the eagle\'s wing carefully before making a decision."', ans:'examined',
    why:'The correct spelling is "examined" — with an "x", even though it sounds like "gz".' },
  { n:9, section:'spell', type:'spell', tier:'Intermediate', marks:1,
    body:'"The two cyclists narrowly avoided a <u>colision</u> at the corner."', ans:'collision',
    why:'The correct spelling is "collision" — with a double "l".' },
  { n:10, section:'spell', type:'spell', tier:'Intermediate', marks:1,
    body:'"They searched <u>desperatly</u> for the missing dog as it grew dark."', ans:'desperately',
    why:'The correct spelling is "desperately" — des-per-ate-ly, four beats, none dropped.' },

  /* ===== SECTION B — Definition matching (Q11-20), type select, 1 mark each ===== */
  { n:11, section:'meaning', type:'select', tier:'Basic', marks:1, options:['A','B','C','D','E','F','G','H','I','J'],
    body:'plateau', ans:3, why:'A plateau is "a flat, high area of land" — letter C.' },
  { n:12, section:'meaning', type:'select', tier:'Basic', marks:1, options:['A','B','C','D','E','F','G','H','I','J'],
    body:'porous', ans:6, why:'Porous means "full of tiny holes that let water or air pass through" — letter F.' },
  { n:13, section:'meaning', type:'select', tier:'Basic', marks:1, options:['A','B','C','D','E','F','G','H','I','J'],
    body:'dormant', ans:10, why:'Dormant means "sleeping, or not active at the moment, but able to wake up again" — letter J.' },
  { n:14, section:'meaning', type:'select', tier:'Basic', marks:1, options:['A','B','C','D','E','F','G','H','I','J'],
    body:'extinct', ans:2, why:'Extinct means "dead and finished forever, and never able to become active again" — letter B. Compare with dormant (J), which can still wake up.' },
  { n:15, section:'meaning', type:'select', tier:'Basic', marks:1, options:['A','B','C','D','E','F','G','H','I','J'],
    body:'erode', ans:8, why:'Erode means "to wear something away slowly, a little at a time" — letter H.' },
  { n:16, section:'meaning', type:'select', tier:'Basic', marks:1, options:['A','B','C','D','E','F','G','H','I','J'],
    body:'nomad', ans:5, why:'A nomad is "a person who moves from place to place to find water and food" — letter E.' },
  { n:17, section:'meaning', type:'select', tier:'Basic', marks:1, options:['A','B','C','D','E','F','G','H','I','J'],
    body:'enclosure', ans:9, why:'An enclosure is "an area with a fence or walls all around it, where animals are kept" — letter I.' },
  { n:18, section:'meaning', type:'select', tier:'Basic', marks:1, options:['A','B','C','D','E','F','G','H','I','J'],
    body:'intruder', ans:7, why:'An intruder is "someone or something that comes into a place where it is not wanted" — letter G.' },
  { n:19, section:'meaning', type:'select', tier:'Basic', marks:1, options:['A','B','C','D','E','F','G','H','I','J'],
    body:'airborne', ans:4, why:'Airborne means "up in the air and flying" — letter D.' },
  { n:20, section:'meaning', type:'select', tier:'Basic', marks:1, options:['A','B','C','D','E','F','G','H','I','J'],
    body:'glared', ans:1, why:'Glared means "looked at someone in a very angry way" — letter A.' },

  /* ===== SECTION C — Word-box cloze (Q21-30), type select, 1 mark each ===== */
  { n:21, section:'boxcloze', type:'select', tier:'Intermediate', marks:1, options:BOX_WORDS,
    body:'Gap — "Nara ___ down low behind the fence so the birds wouldn\'t notice her."', ans:6,
    why:'"Crouched" fits — bending low behind the fence. "Stumbled" is also a past-tense movement word, but stumbling means tripping, not bending down on purpose; "admired" and "injured" are also past-tense verbs but neither means bending low.' },
  { n:22, section:'boxcloze', type:'select', tier:'Intermediate', marks:1, options:BOX_WORDS,
    body:'Gap — "Scientists have recorded over forty different ___ of butterfly living in this one valley."', ans:10,
    why:'"Species" fits — a type or kind of butterfly. "Competition" and "balance" are nouns too, but neither fits "different ___ of butterfly".' },
  { n:23, section:'boxcloze', type:'select', tier:'Intermediate', marks:1, options:BOX_WORDS,
    body:'Gap — "The goalkeeper was badly ___ after the collision and had to leave the pitch."', ans:9,
    why:'"Injured" fits — hurt after the collision. "Admired" is also past tense, but means respected, not hurt.' },
  { n:24, section:'boxcloze', type:'select', tier:'Intermediate', marks:1, options:BOX_WORDS,
    body:'Gap — "Tightrope walkers need incredible ___ to cross without falling."', ans:2,
    why:'"Balance" fits — the steadiness needed not to fall. "Species" and "competition" are nouns but do not mean steadiness.' },
  { n:25, section:'boxcloze', type:'select', tier:'Intermediate', marks:1, options:BOX_WORDS,
    body:'Gap — "The desert has a dry, hot ___ , with almost no rainfall all year."', ans:3,
    why:'"Climate" fits — the typical weather pattern of a place. "Delta" and "crater" are landforms, not weather.' },
  { n:26, section:'boxcloze', type:'select', tier:'Intermediate', marks:1, options:BOX_WORDS,
    body:'Gap — "Everyone in the crowd ___ how calmly the pilot landed the damaged plane."', ans:1,
    why:'"Admired" fits — felt respect for the calm landing. "Dismay" is a feeling too, but a negative one, and it is a noun, not a verb that fits this sentence\'s grammar.' },
  { n:27, section:'boxcloze', type:'select', tier:'Intermediate', marks:1, options:BOX_WORDS,
    body:'Gap — "He ___ over the loose brick and nearly dropped the tray of cups."', ans:11,
    why:'"Stumbled" fits — tripping over the brick. "Crouched" is also a movement word, but crouching is bending down on purpose, not tripping.' },
  { n:28, section:'boxcloze', type:'select', tier:'Intermediate', marks:1, options:BOX_WORDS,
    body:'Gap — "Camels can ___ for many days in the desert without drinking water."', ans:12,
    why:'"Survive" fits — stay alive through the hard conditions. None of the other box words mean staying alive.' },
  { n:29, section:'boxcloze', type:'select', tier:'Intermediate', marks:1, options:BOX_WORDS,
    body:'Gap — "There was fierce ___ between the two runners for first place."', ans:4,
    why:'"Competition" fits — the rivalry between the two runners. "Species" is also a noun, but does not mean rivalry.' },
  { n:30, section:'boxcloze', type:'select', tier:'Intermediate', marks:1, options:BOX_WORDS,
    body:'Gap — "A deep ___ was left in the ground where the old volcano had once erupted."', ans:5,
    why:'"Crater" fits — the hollow left after an eruption. "Delta" is also a landform, but it forms where a river meets the sea, not from an eruption.' },

  /* ===== SECTION D — Reading (Q31-48) ===== */
  // Text 1 — Canyon Ridge National Park (info text + table)
  { n:31, section:'reading', type:'mcq', tier:'Basic', marks:1, passageId:'t1',
    body:'According to the table, which trail is the longest?',
    options:['Sunset Overlook','Echo Gorge Trail','Old Lava Loop','Devil\'s Arch Path'], ans:2,
    why:'Echo Gorge Trail is 9.5 km, the longest listed — a fact read straight from the table.' },
  { n:32, section:'reading', type:'mcq', tier:'Basic', marks:1, passageId:'t1',
    body:'According to the paragraph text, what caused the waterfall lookout path to be rebuilt last year?',
    options:['A wildfire','Heavy flooding','Too many visitors','A rockfall'], ans:4,
    why:'The text states the path "was rebuilt last year after a rockfall closed the old route" — a fact stated in the paragraphs.' },
  { n:33, section:'reading', type:'mcq', tier:'Intermediate', marks:1, passageId:'t1',
    body:'A family wants a trail suitable for young children. Combining the table with the Safety Rules box, which detail matters most?',
    options:['Difficulty level — Hard trails need an experienced adult','The colour of the trail markers','How many photos the trail allows','Which judge is assigned to the trail'], ans:1,
    why:'The Safety Rules box warns that Hard-rated trails need an adult experienced in the terrain — combining that rule with the table\'s Difficulty column is what matters for a family with young children.' },
  { n:34, section:'reading', type:'mcq', tier:'Intermediate', marks:1, passageId:'t1',
    body:'Why do you think the Old Lava Loop trail is only open in the cooler months (Apr–Oct)?',
    options:['Because the park is closed in winter','Because lava fields form only in cool places','Because dark lava rock gets dangerously hot in summer','Because visitor numbers are lowest in autumn'], ans:3,
    why:'This is not stated directly — it must be inferred from knowing dark rock absorbs and holds heat, making it dangerous underfoot in the hottest months, which the guide does not spell out but the surrounding safety information points toward.' },

const PASSAGES = {
  t1: `<h4>Canyon Ridge National Park — Visitor Guide</h4>

  On Thursday, during the final run-through, Niran was sent to fetch a music stand from behind the stage curtain. As he stepped back, his foot caught one of the long cables snaking across the floor, and the whole hall fell silent — the backing track had cut out completely. Every head in the room turned to look at him. Niran froze, staring hard at his own shoes, wishing the stage floor would simply open up and swallow him.
  Mr Aditya, the music teacher, jogged over to the sound desk at the back of the hall. It took him almost five minutes to work out which cable Niran had pulled loose, plugging and unplugging wires until the music finally crackled back to life. Rehearsal picked back up, but Niran barely sang another note for the rest of the afternoon.
  He stayed behind after everyone else had left, telling his friends he'd catch up with them later. He couldn't stop wondering how the tangle of cables was actually meant to connect — which lead ran to which speaker, and why pulling just one of them had silenced the whole hall. Mr Aditya, packing away microphone stands, noticed him staring and asked if he wanted to see how the desk worked. For the next half hour, Niran learned how each fader controlled a different microphone, and how the lighting board above it could bring a spotlight up slowly instead of snapping it on.
  By the night of the real show, Niran wasn't standing in the choir line at all. He was sitting at the sound desk at the back of the hall, bringing up each singer's microphone at exactly the right moment and fading the stage lights from blue to gold for the final song. Afterwards, Mr Aditya told the whole choir that the show wouldn't have sounded half as good without Niran's ears at that desk. For the first time all term, nobody looked away when his name was mentioned — they turned to grin at him instead.`,

/* ---------- END EDIT PER UNIT ---------- */

document.getElementById('hdr-title').textContent = `Unit ${UNIT_NUM} Test — ${UNIT_TITLE}`;
document.getElementById('hdr-sub').textContent = UNIT_SUB;
document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
document.getElementById('btn-submit').textContent = `Answer all ${Q.length} to submit`;

const chosen = {};   // qn -> value (index for mcq/select 1-based, string for spell/written)
let submitted = false;

function render(){
  const quiz = document.getElementById('quiz');
  let html = '';
  let lastSection = null;
  Q.forEach(q => {
    if (q.section !== lastSection){
      html += `<div class="band ${q.section}">${SECTION_LABEL[q.section]}</div>`;
      html += `<div class="hint">${SECTION_HINT[q.section] || ''}</div>`;
      if (q.section === 'meaning'){
        html += `<div class="defpanel"><table>`;
        DEFINITIONS.forEach((d,i)=>{ html += `<tr><td class="letter">${String.fromCharCode(65+i)}</td><td>${d}</td></tr>`; });
        html += `</table></div>`;
      }
      if (q.section === 'boxcloze'){
        html += `<div class="boxpanel">BOX: ${BOX_WORDS.slice().sort().join(' · ')}</div>`;
      }
      lastSection = q.section;
    }
    if (q.section === 'reading' && (!lastPassage || lastPassage !== q.passageId)){
      html += `<div class="passage">${PASSAGES[q.passageId]}</div>`;
      lastPassage = q.passageId;
    }
    html += `<div class="q ${q.section}" id="q-${q.n}">
      <p class="body"><span class="qnum">Q${q.n}.</span> ${q.body}
        <span class="tier-tag">${q.tier}</span>
        <span class="result-tag ok" id="tag-ok-${q.n}">&#10003; correct</span>
        <span class="result-tag bad" id="tag-bad-${q.n}">&#10007; not quite</span>
        <span class="result-tag pending" id="tag-pending-${q.n}">awaiting Naomi</span>
      </p>`;
    if (q.type === 'mcq'){
      html += `<div>`;
      q.options.forEach((opt, idx) => {
        html += `<button class="opt" id="opt-${q.n}-${idx+1}" onclick="choose(${q.n}, ${idx+1})">${idx+1}. ${opt}</button>`;
      });
      html += `</div>`;
    } else if (q.type === 'spell'){
      html += `<input type="text" class="spellin" id="in-${q.n}" autocomplete="off" autocapitalize="off" oninput="typeAnswer(${q.n}, this.value)">`;
    } else if (q.type === 'select'){
      html += `<select class="selin" id="in-${q.n}" onchange="choose(${q.n}, this.selectedIndex)"><option value="">— choose —</option>`;
      q.options.forEach((opt, idx) => { html += `<option value="${idx+1}">${opt}</option>`; });
      html += `</select>`;
    } else if (q.type === 'written'){
      html += `<textarea class="writtenin" id="in-${q.n}" placeholder="Write your answer in full sentences..." oninput="typeAnswer(${q.n}, this.value)"></textarea>`;
    }
    html += `<div class="why" id="why-${q.n}">💡 <b>Why:</b> ${q.why||''}</div>`;
    if (q.type === 'written'){
      html += `<div class="markscheme" id="ms-${q.n}"><b>Mark scheme (${q.marks} marks):</b><ul>${(q.markScheme||[]).map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
    }
    html += `</div>`;
  });
  quiz.innerHTML = html;
}
let lastPassage = null;

function choose(qn, idx){
  if (submitted) return;
  chosen[qn] = idx;
  const q = Q.find(x => x.n === qn);
  if (q.type === 'mcq'){
    q.options.forEach((_, i) => document.getElementById(`opt-${qn}-${i+1}`).classList.remove('selected'));
    document.getElementById(`opt-${qn}-${idx}`).classList.add('selected');
  }
  updateProgress();
}
function typeAnswer(qn, val){
  if (submitted) return;
  chosen[qn] = val;
  updateProgress();
}
function isAnswered(q){
  const v = chosen[q.n];
  if (q.type === 'spell') return v !== undefined && v.trim().length > 0;
  // Written short-answer items (Applied tier, 3 marks, hand-marked by Naomi) must not be gated on
  // word count — a correct answer can legitimately be short (e.g. "From nervous to confident" is a
  // complete, correct 4-word answer to a feelings-change question). Only Task W (Paper 2) has a real
  // minimum-length requirement, because that IS the writing task being assessed. Fixed 29 Sep 2026
  // after this exact bug stuck Prem at "47/48 answered" with no way to find the blocking question.
  if (q.type === 'written') return v !== undefined && v.trim().length > 0;
  return v !== undefined && v !== '';
}
function updateProgress(){
  const n = Q.filter(isAnswered).length;
  document.getElementById('progress-label').textContent = `${n} / ${Q.length} answered`;
  document.getElementById('progress-fill').style.width = (n/Q.length*100) + '%';
  const btn = document.getElementById('btn-submit');
  if (n === Q.length){
    btn.disabled = false;
    btn.textContent = 'Submit Paper 1';
  } else {
    btn.disabled = false;
    btn.textContent = `Answer all ${Q.length} to submit (${Q.length-n} left) — tap to jump there`;
  }
}

function firstUnanswered(){
  return Q.find(q => !isAnswered(q));
}

function askConfirmSubmit(){
  const missing = firstUnanswered();
  if (missing){
    const el = document.getElementById(`q-${missing.n}`);
    if (el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('jump-highlight');
      setTimeout(() => el.classList.remove('jump-highlight'), 2000);
    }
    return;
  }
  document.getElementById('confirm-overlay').classList.add('show');
}
function closeConfirm(){ document.getElementById('confirm-overlay').classList.remove('show'); }

let lastResults = null;

function doSubmit(){
  closeConfirm();
  submitted = true;
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  document.querySelectorAll('select.selin').forEach(s => s.disabled = true);
  document.querySelectorAll('input.spellin').forEach(i => i.disabled = true);
  document.querySelectorAll('textarea.writtenin').forEach(t => t.disabled = true);

  let autoScore = 0;
  const tierTally = {Basic:{c:0,t:0},Intermediate:{c:0,t:0},Applied:{c:0,t:0}};
  const sectionTally = {}; SECTION_ORDER.forEach(s => sectionTally[s]={c:0,t:0});
  const written = [];

  const answers = Q.map(q => {
    const given = chosen[q.n];
    if (q.type === 'written'){
      written.push({ q:q.n, marks:q.marks, markScheme:q.markScheme, response: given||'' });
      document.getElementById(`ms-${q.n}`).classList.add('show');
      document.getElementById(`tag-pending-${q.n}`).classList.add('show');
      sectionTally[q.section].t++;
      return { q:q.n, section:q.section, type:q.type, given, isCorrect:null };
    }
    let isCorrect;
    if (q.type === 'spell'){
      isCorrect = (given||'').trim().toLowerCase() === q.ans;
      const el = document.getElementById(`in-${q.n}`);
      el.classList.add(isCorrect?'correct':'wrong');
      if (!isCorrect){ el.insertAdjacentHTML('afterend', `<div style="font-size:.82rem;color:#c62828;margin-top:4px">Correct: <b>${q.ans}</b></div>`); }
    } else {
      isCorrect = given === q.ans;
      if (q.type === 'mcq'){
        document.getElementById(`opt-${q.n}-${given}`).classList.add(isCorrect?'correct':'wrong');
        if (!isCorrect) document.getElementById(`opt-${q.n}-${q.ans}`).classList.add('correct');
      } else if (q.type === 'select'){
        document.getElementById(`in-${q.n}`).classList.add(isCorrect?'correct':'wrong');
      }
    }
    if (isCorrect) autoScore++;
    tierTally[q.tier].t++; if (isCorrect) tierTally[q.tier].c++;
    sectionTally[q.section].t++; if (isCorrect) sectionTally[q.section].c++;
    document.getElementById(`why-${q.n}`).classList.add('show');
    document.getElementById(isCorrect?`tag-ok-${q.n}`:`tag-bad-${q.n}`).classList.add('show');
    return { q:q.n, section:q.section, type:q.type, given, correct:q.ans, isCorrect };
  });

  const banner = document.getElementById('score-banner');
  banner.classList.add('show','pass');
  document.getElementById('score-big').textContent = `Auto score: ${autoScore} / ${AUTO_OUT_OF}`;
  document.getElementById('score-msg').textContent = `The ${WRITTEN_MARKS} written marks are waiting for Naomi. Pass bar for the full paper is ${PASS_BAR}/${TOTAL_MARKS} (80%).`;
  document.getElementById('section-scores').innerHTML =
    SECTION_ORDER.map(s => `<div class="sec-chip">${SECTION_LABEL[s].split('—')[1].trim()}: ${sectionTally[s].c}/${sectionTally[s].t - (s==='reading'?6:0)}${s==='reading'?' auto (+6 written)':''}</div>`).join('') +
    `<div class="sec-chip">Basic: ${tierTally.Basic.c}/${tierTally.Basic.t}</div><div class="sec-chip">Intermediate: ${tierTally.Intermediate.c}/${tierTally.Intermediate.t}</div><div class="sec-chip">Applied (auto n/a): ${tierTally.Applied.t} written</div>`;

  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('btn-submit').style.display = 'none';
  document.getElementById('btn-save').style.display = 'inline-block';
  document.getElementById('btn-hub').style.display = 'inline-block';
  document.getElementById('btn-next').style.display = 'inline-block';

  lastResults = {
    student: "Prem",
    unit: UNIT_NUM,
    paper: 1,
    unitTitle: UNIT_TITLE,
    dateTaken: new Date().toISOString().slice(0,10),
    submittedAt: new Date().toISOString(),
    openedAt: openedAt,
    minutesSpent: Math.round((Date.now()-openedAtMs)/60000),
    autoScore, autoOutOf: AUTO_OUT_OF,
    writtenMarks: WRITTEN_MARKS, writtenScore: null,
    total: TOTAL_MARKS, passBar: PASS_BAR, passed: null,
    tiers: tierTally,
    sections: SECTION_ORDER.map(s => ({ name:s, score:sectionTally[s].c, outOf:sectionTally[s].t })),
    answers,
    written
  };
}

async function saveResults(){
  const filename = `ENG_U038P1_Results_${lastResults.dateTaken}.json`;
  const json = JSON.stringify(lastResults, null, 2);
  const statusEl = document.getElementById('save-status');
  if (window.showSaveFilePicker){
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description:'Test results JSON', accept:{'application/json':['.json']} }] });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      statusEl.textContent = `Saved as ${filename}.`;
      return;
    } catch(e){ if (e.name === 'AbortError'){ statusEl.textContent = 'Save cancelled — click the button again when ready.'; return; } }
  }
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  statusEl.textContent = `Downloaded ${filename} — please move it into Lessons\\Tests\\Results.`;
}

const openedAtMs = Date.now();
const openedAt = new Date().toISOString();
render();
updateProgress();
</script>
