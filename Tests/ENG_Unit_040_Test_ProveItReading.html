 "t1": "<h4>How Honeybees Choose a New Home</h4>\n<p>In late spring, a busy honeybee colony can become crowded. There are too many bees and not enough room for them all. So the old queen leaves the hive with about half of the bees. The rest stay behind with a new queen. Together, the bees that leave form a swarm. The swarm hangs like a beard from a branch while a few hundred scouts go searching for a new home.</p>\n<p>A scout cannot settle for just any hole. She is looking for a dry space about the size of a big bucket, which is about 40 litres. If it is any smaller, there will not be enough room to store the honey the bees need to get through winter. The space should also be high off the ground, at least three metres, so that hungry animals cannot reach it. Finally, it needs a small entrance. A small entrance is easy for the bees to guard, and it also keeps out wind and rain.</p>\n<p>When a scout returns, she tells the others what she found by dancing on the surface of the swarm. A scout that has found a good site dances for a long time and repeats her dance many times. A scout that found a poor site dances only briefly, or not at all. The more a site is danced for, the more scouts fly out to inspect it, and some of those scouts return and dance for it too.</p>\n<p>Slowly, the scouts begin to agree. When about twenty or thirty scouts are waiting at the same site, they fly back to the swarm and signal that it is time. Then the whole swarm lifts off and flies there together. The whole decision usually takes between one and three days.</p>\n<p>Here are three sites that scouts found one spring, and what they measured at each:</p>\n<table>\n<tr><th>Site the scouts found</th><th>Space inside</th><th>Height above the ground</th><th>Entrance</th></tr>\n<tr><td>Hollow in an old oak tree</td><td>about 40 litres</td><td>5 metres</td><td>small hole, easy to guard</td></tr>\n<tr><td>Wooden box on a garden shed</td><td>about 15 litres</td><td>2 metres</td><td>wide crack along one side</td></tr>\n<tr><td>Gap behind a chimney</td><td>about 45 litres</td><td>8 metres</td><td>large, open to wind and rain</td></tr>\n</table>",

    for(var i=0;i+4<=p.length;i++){
      if(t.indexOf(' '+p.slice(i,i+4).join(' ')+' ')>=0){
        if(!anchors||!anchors.length) return true;
        for(var a=0;a<anchors.length;a++){ if(t.indexOf(norm(anchors[a]))>=0) return true; }
      }
    }
  }
  return false;
}


document.getElementById('hdr-title').textContent = `Unit ${UNIT_NUM} Test — ${UNIT_TITLE}`;
document.getElementById('hdr-sub').textContent = UNIT_SUB;
document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
document.getElementById('btn-submit').textContent = `Answer all ${Q.length} to submit`;

const chosen = {};      // qn -> mcq index (1-based) or written answer text
const proofs = {};      // qn -> proof text
const proofTries = {};  // qn -> number of rejected proofs
const lastRej = {};     // qn -> last rejected proof text
const gaveUp = {};      // qn -> true when he pressed "I can't find it" (no lock-out: he can always submit)
let submitted = false;

function render(){
  const quiz = document.getElementById('quiz');
  let html = '';
  SECTION_ORDER.forEach(sec => {
    html += `<div class="band ${sec}">${SECTION_LABEL[sec]}</div>`;
    html += `<div class="hint">${SECTION_HINT[sec]}</div>`;
    html += `<div class="grp"><div class="passage">${PASSAGES[sec]}</div><div class="qs">`;
    Q.filter(q => q.section === sec).forEach(q => {
      html += `<div class="q ${q.section}" id="q-${q.n}">
        <p class="body"><span class="qnum">Q${q.n}.</span> ${q.body}
          <span class="tier-tag">${q.tier}</span>
          ${q.type==='written' ? `<span class="marks-tag">(${q.marks} mks)</span>` : ''}
          <span class="result-tag ok" id="tag-ok-${q.n}">&#10003; correct</span>
          <span class="result-tag bad" id="tag-bad-${q.n}">&#10007; not quite</span>
          <span class="result-tag pending" id="tag-pending-${q.n}">awaiting Naomi</span>
        </p>`;
      if (q.type === 'mcq'){
        html += `<div>`;
        q.options.forEach((opt, idx) => {
          html += `<button class="opt" id="opt-${q.n}-${idx+1}" onclick="choose(${q.n}, ${idx+1})">${idx+1}. ${opt}</button>`;
        });
        html += `</div>`;
      } else {
        html += `<label class="fld">Proof — copy at least 4 words from the text</label>
          <input type="text" class="proofin" id="pr-${q.n}" autocomplete="off" oninput="typeProof(${q.n}, this.value)" onblur="checkProof(${q.n})">
          <div class="proofmsg" id="pm-${q.n}"></div>
          <button class="btn chk" id="pc-${q.n}" onclick="checkProof(${q.n})">Check my proof</button><button class="btn chk skip" id="sk-${q.n}" style="display:none" onclick="giveUp(${q.n})">I can't find it — move on</button>
          <label class="fld">Your answer — full sentences</label>
          <textarea class="writtenin" id="in-${q.n}" placeholder="Write your answer in full sentences..." oninput="typeAnswer(${q.n}, this.value)"></textarea>`;
      }
      html += `<div class="why" id="why-${q.n}">💡 <b>Why:</b> ${q.why||''}</div>`;
      if (q.type === 'written'){
        html += `<div class="markscheme" id="ms-${q.n}"><b>Mark scheme (${q.marks} marks):</b><ul>${(q.markScheme||[]).map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
      }
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  quiz.innerHTML = html;
}

function choose(qn, idx){
  if (submitted) return;
  chosen[qn] = idx;
  const q = Q.find(x => x.n === qn);
  q.options.forEach((_, i) => document.getElementById(`opt-${qn}-${i+1}`).classList.remove('selected'));
  document.getElementById(`opt-${qn}-${idx}`).classList.add('selected');
  updateProgress();
}
function typeAnswer(qn, val){
  if (submitted) return;
  chosen[qn] = val;
  updateProgress();
}
function typeProof(qn, val){
  if (submitted) return;
  proofs[qn] = val; gaveUp[qn] = false;
  const el = document.getElementById(`pr-${qn}`);
  el.classList.remove('good','badp');
  const m = document.getElementById(`pm-${qn}`); m.textContent = ''; m.classList.remove('good');
  updateProgress();
}
function proofIsGood(q){
  return proofOK(proofs[q.n] || '', PASSAGES[q.passageId], q.anchors);
}
// Called when he leaves the proof box, presses "Check my proof", or presses Submit.
// A rejection counts once per different text (re-checking the same text does not add a try).
function checkProof(qn){
  if (submitted) return;
  const q = Q.find(x => x.n === qn);
  const v = (proofs[qn] || '');
  const el = document.getElementById(`pr-${qn}`), m = document.getElementById(`pm-${qn}`);
  if (!v.trim()){ m.textContent = ''; return; }
  if (proofIsGood(q)){
    el.classList.remove('badp'); el.classList.add('good');
    m.classList.add('good'); m.textContent = '✓ Those words are in the text and they prove your answer.';
    return;
  }
  const inText = proofOK(v, PASSAGES[q.passageId], null);
  m.classList.remove('good'); el.classList.remove('good'); el.classList.add('badp');
  m.textContent = inText
    ? "Those words are in the text, but they don't prove this answer. Find the sentence that does."
    : "Those words aren't in the text yet — find them and copy them exactly.";
  if (lastRej[qn] !== v){
    proofTries[qn] = (proofTries[qn] || 0) + 1;
    lastRej[qn] = v;
  }
  showSkip(qn);
}
function showSkip(qn){ const b = document.getElementById(`sk-${qn}`); if (b) b.style.display = 'inline-block'; }
// Never lock a child out: if he cannot find the proof he can say so, write his best answer, and submit.
function giveUp(qn){
  if (submitted) return;
  gaveUp[qn] = true;
  const m = document.getElementById(`pm-${qn}`); m.classList.add('good');
  m.textContent = "That's OK. Now write your best answer in the box below.";
  updateProgress();
}
function isAnswered(q){
  const v = chosen[q.n];
  if (q.type === 'written'){
    // Hand-marked: no word-count gate (a correct answer can be short). Needs a proof the checker accepts + a non-empty answer.
    return v !== undefined && v.trim().length > 0 && (proofIsGood(q) || gaveUp[q.n] === true);
  }
  return v !== undefined && v !== '';
}
function updateProgress(){
  const n = Q.filter(isAnswered).length;
  document.getElementById('progress-label').textContent = `${n} / ${Q.length} answered`;
  document.getElementById('progress-fill').style.width = (n/Q.length*100) + '%';
  const btn = document.getElementById('btn-submit');
  btn.disabled = false;
  btn.textContent = (n === Q.length) ? 'Submit the test' : `Answer all ${Q.length} to submit (${Q.length-n} left) — tap to jump there`;
}
function firstUnanswered(){ return Q.find(q => !isAnswered(q)); }

function askConfirmSubmit(){
  Q.filter(q => q.type === 'written').forEach(q => { if ((proofs[q.n]||'').trim()) checkProof(q.n); });
  const missing = firstUnanswered();
  if (missing){
    if (missing.type === 'written' && !(proofs[missing.n]||'').trim()){
      const m = document.getElementById(`pm-${missing.n}`); m.classList.remove('good');
      m.textContent = 'Copy the words from the text that prove your answer into this box. Stuck? Press "I can\'t find it".';
      showSkip(missing.n);
    }
    const el = document.getElementById(`q-${missing.n}`);
    if (el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('jump-highlight');
      setTimeout(() => el.classList.remove('jump-highlight'), 2000);
    }
    return;
  }
  document.getElementById('confirm-overlay').classList.add('show');
}
function closeConfirm(){ document.getElementById('confirm-overlay').classList.remove('show'); }

let lastResults = null;

function doSubmit(){
  closeConfirm();
  submitted = true;
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  document.querySelectorAll('input.proofin').forEach(i => i.disabled = true);
  document.querySelectorAll('button.chk').forEach(b => b.style.display = 'none');
  document.querySelectorAll('textarea.writtenin').forEach(t => t.disabled = true);

  let autoScore = 0;
  const tierTally = {Basic:{c:0,t:0},Intermediate:{c:0,t:0},Applied:{c:0,t:0}};
  const sectionTally = {}; SECTION_ORDER.forEach(s => sectionTally[s]={c:0,t:0});
  const written = [];

  const answers = Q.map(q => {
    const given = chosen[q.n];
    if (q.type === 'written'){
      const tries = proofTries[q.n] || 0;
      written.push({ q:q.n, marks:q.marks, markScheme:q.markScheme, proof: proofs[q.n]||'', proofTries: tries, proofFirstTryOK: tries === 0, proofAccepted: proofIsGood(q), proofGaveUp: (gaveUp[q.n] === true && !proofIsGood(q)),
                     response: given||'', wordCount: (given||'').trim().split(/\s+/).filter(Boolean).length });
      document.getElementById(`ms-${q.n}`).classList.add('show');
      document.getElementById(`tag-pending-${q.n}`).classList.add('show');
      tierTally.Applied.t++;
      return { q:q.n, section:q.section, type:q.type, given, proof: proofs[q.n]||'', isCorrect:null };
    }
    const isCorrect = given === q.ans;
    document.getElementById(`opt-${q.n}-${given}`).classList.add(isCorrect?'correct':'wrong');
    if (!isCorrect) document.getElementById(`opt-${q.n}-${q.ans}`).classList.add('correct');
    if (isCorrect) autoScore++;
    tierTally[q.tier].t++; if (isCorrect) tierTally[q.tier].c++;
    sectionTally[q.section].t++; if (isCorrect) sectionTally[q.section].c++;   // auto-scored items only
    document.getElementById(`why-${q.n}`).classList.add('show');
    document.getElementById(isCorrect?`tag-ok-${q.n}`:`tag-bad-${q.n}`).classList.add('show');
    return { q:q.n, section:q.section, type:q.type, given, correct:q.ans, isCorrect };
  });

  const banner = document.getElementById('score-banner');
  banner.classList.add('show','pass');
  document.getElementById('score-big').textContent = `Auto score: ${autoScore} / ${AUTO_OUT_OF}`;
  document.getElementById('score-msg').textContent = `The ${WRITTEN_MARKS} written marks are waiting for Naomi. Pass bar for the full test is ${PASS_BAR}/${TOTAL_MARKS} (80%).`;
  document.getElementById('section-scores').innerHTML =
    SECTION_ORDER.map(s => {
      const wrT = Q.filter(q=>q.section===s && q.type==='written').length;
      return `<div class="sec-chip">${SECTION_LABEL[s].split('—')[1].trim()}: ${sectionTally[s].c}/${sectionTally[s].t} auto (+${wrT} written)</div>`;
    }).join('') +
    `<div class="sec-chip">Basic: ${tierTally.Basic.c}/${tierTally.Basic.t}</div><div class="sec-chip">Intermediate: ${tierTally.Intermediate.c}/${tierTally.Intermediate.t}</div><div class="sec-chip">Applied: ${tierTally.Applied.t} written (hand-marked)</div>`;

  banner.scrollIntoView({behavior:'smooth'});
  document.getElementById('btn-submit').style.display = 'none';
  document.getElementById('btn-save').style.display = 'inline-block';
  document.getElementById('btn-hub').style.display = 'inline-block';
  const st = document.getElementById('save-status');
  st.className = 'reminder'; st.textContent = 'Press the blue Save button — your results are NOT saved yet.';

  lastResults = {
    student: "Prem",
    unit: UNIT_NUM,
    unitTitle: UNIT_TITLE,
    dateTaken: new Date().toISOString().slice(0,10),
    submittedAt: new Date().toISOString(),
    openedAt: openedAt,
    minutesSpent: Math.round((Date.now()-openedAtMs)/60000),
    autoScore, autoOutOf: AUTO_OUT_OF,
    writtenMarks: WRITTEN_MARKS, writtenScore: null,
    total: TOTAL_MARKS, passBar: PASS_BAR, passed: null,
    tiers: tierTally,
    sections: SECTION_ORDER.map(s => ({ name:s, score:sectionTally[s].c, outOf:sectionTally[s].t })),
    answers,
    written
  };
}

async function saveResults(){
  const filename = `ENG_U040_Results_${lastResults.dateTaken}.json`;
  const json = JSON.stringify(lastResults, null, 2);
  const statusEl = document.getElementById('save-status');
  if (window.showSaveFilePicker){
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description:'Test results JSON', accept:{'application/json':['.json']} }] });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      statusEl.className = ''; statusEl.textContent = `Saved as ${filename}.`;
      return;
    } catch(e){ if (e.name === 'AbortError'){ statusEl.className = 'reminder'; statusEl.textContent = 'Save cancelled — your results are NOT saved yet. Click the blue button again.'; return; } }
  }
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  statusEl.className = ''; statusEl.textContent = `Downloaded ${filename} — please move it into Lessons\\Tests\\Results.`;
}

const openedAtMs = Date.now();
const openedAt = new Date().toISOString();
render();
updateProgress();
</script>
